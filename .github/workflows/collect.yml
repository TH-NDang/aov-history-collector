name: Collect AoV historical teams and people

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect.yml"
  workflow_dispatch:
    inputs:
      limit_teams:
        description: "Số trang đội xử lý trong lượt này"
        required: false
        default: "80"
      limit_people:
        description: "Số tuyển thủ/staff xử lý trong lượt này"
        required: false
        default: "80"
      skip_images:
        description: "Bỏ qua tải ảnh"
        type: boolean
        required: false
        default: false
      auto_continue:
        description: "Tự chạy lượt tiếp theo cho đến khi hoàn tất"
        type: boolean
        required: false
        default: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: aov-history-collector
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore collection checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            output
          key: aov-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            aov-history-${{ runner.os }}-

      - name: Validate parsers
        run: python -m unittest discover -s tests -v

      - name: Collect data and images
        shell: bash
        run: |
          args=(--limit-teams "${{ inputs.limit_teams || '80' }}" --limit-people "${{ inputs.limit_people || '80' }}")
          if [[ "${{ inputs.skip_images }}" == "true" ]]; then
            args+=(--skip-images)
          fi
          python collector.py "${args[@]}"

      - name: Package output
        if: always()
        run: python package_output.py

      - name: Save collection checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
            output
          key: aov-history-${{ runner.os }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aov-history-data-${{ github.run_number }}
          path: |
            aov-history-data.zip
            output/manifest.json
            output/state.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Check collection progress
        id: progress
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path("output/state.json").read_text(encoding="utf-8"))
          progress = state.get("progress", {})
          known_teams = int(progress.get("known_team_pages", 0))
          finished_teams = int(progress.get("finished_team_pages", 0))
          known_people = int(progress.get("known_people", 0))
          finished_people = int(progress.get("finished_people", 0))
          complete = (
              known_teams > 0
              and finished_teams == known_teams
              and finished_people == known_people
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"complete={str(complete).lower()}\n")

          print(
              f"Teams: {finished_teams}/{known_teams}; "
              f"people: {finished_people}/{known_people}; complete={complete}"
          )
          PY

      - name: Start next batch automatically
        if: >-
          steps.progress.outputs.complete == 'false' &&
          (github.event_name == 'push' || inputs.auto_continue == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches" \
            -f ref="${{ github.ref_name }}" \
            -f "inputs[limit_teams]=${{ inputs.limit_teams || '80' }}" \
            -f "inputs[limit_people]=${{ inputs.limit_people || '80' }}" \
            -f "inputs[skip_images]=${{ inputs.skip_images || 'false' }}" \
            -f "inputs[auto_continue]=true"
